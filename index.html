<!doctype html>
<html lang="zh-CN" class="entry-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d1b18">
  <meta name="description" content="麦兜的一段小小生活切片。向下继续，向上重看。">
  <title>麦兜 · 一只小鼠的日常</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@400;500;600;700;800&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --duration: 38;
      --scroll-height: 3800vh;
      --paper: #f4eadc;
      --ink: #211b17;
      --blue: #376d9d;
      --tomato: #dd6556;
      --cream: #fbf4e9;
      --sans: "DM Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      --serif: "Cormorant Garamond", "Noto Serif SC", "Songti SC", "STSong", serif;
      --mono: "DM Mono", "SFMono-Regular", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: #1d1b18;
      scroll-behavior: auto;
      overscroll-behavior-y: none;
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: #1d1b18;
      color: var(--cream);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    html.entry-locked,
    html.entry-locked body {
      height: 100%;
      overflow: hidden;
    }

    .video-stage,
    .cinema-shade {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .video-stage {
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 43%, rgba(77, 92, 99, .35), transparent 48%),
        linear-gradient(145deg, #5f7790 0%, #303e4a 53%, #191918 100%);
    }

    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transition: opacity .5s ease;
      will-change: opacity;
      background: transparent;
    }

    body[data-mode="intro"] #intro-video { opacity: 1; }
    body[data-mode="main"] #main-video { opacity: 1; }
    body[data-mode="outro"] #outro-video { opacity: 1; }
    .scene.is-broken { visibility: hidden; }

    .cinema-shade {
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(17, 20, 23, .25) 0%, rgba(17, 20, 23, 0) 25%, rgba(17, 20, 23, 0) 43%, rgba(14, 17, 18, .68) 100%),
        radial-gradient(ellipse at center, transparent 47%, rgba(12, 14, 16, .19) 100%);
    }

    body[data-entry="closed"] .cinema-shade { background: transparent; }

    .entry-gate {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: rgba(0, 0, 0, .62);
      opacity: 1;
      visibility: visible;
      transition: opacity .48s ease, visibility 0s linear 0s;
    }

    .entry-button {
      display: block;
      width: min(clamp(220px, 14vw, 300px), calc(100vw - 48px));
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      cursor: pointer;
      transition: transform .2s ease, filter .2s ease;
    }

    .entry-button:hover { transform: scale(1.025); filter: brightness(1.04); }
    .entry-button:focus-visible { outline: 2px solid rgba(255, 255, 255, .95); outline-offset: 5px; }
    .entry-button img { display: block; width: 100%; height: auto; }

    .entry-content {
      display: grid;
      justify-items: center;
      gap: 13px;
    }

    .entry-hint {
      margin: 0;
      color: rgba(255, 255, 255, .62);
      font: 400 12px/1.4 var(--sans);
      letter-spacing: .06em;
      text-align: center;
    }

    body[data-entry="closed"] .topline,
    body[data-entry="closed"] .sound-toggle,
    body[data-entry="closed"] .scroll-cue,
    body[data-entry="closed"] .replay-button,
    body[data-entry="closed"] #caption,
    body[data-entry="closed"] #progress-rail,
    body[data-entry="closed"] #media-status { visibility: hidden; }

    body[data-entry="open"] .entry-gate {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .48s ease, visibility 0s linear .48s;
    }

    .scroll-space {
      position: relative;
      z-index: 2;
      width: 100%;
      height: var(--scroll-height);
      pointer-events: none;
    }

    .topline {
      position: fixed;
      z-index: 4;
      top: max(16px, 2vh, env(safe-area-inset-top));
      left: clamp(18px, 1.75vw, 36px);
      right: auto;
      display: flex;
      align-items: center;
      color: rgba(251, 244, 233, .88);
      font: 500 10px/1.3 var(--mono);
      letter-spacing: .15em;
      text-transform: uppercase;
      text-shadow: 0 1px 12px rgba(0, 0, 0, .35);
      pointer-events: none;
    }

    .topline-brand { display: inline-flex; align-items: center; gap: clamp(12px, 1.2vw, 18px); }
    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: clamp(44px, 2.45vw, 52px);
      aspect-ratio: 1;
      border: 1px solid rgba(251, 244, 233, .86);
      border-radius: 50%;
      color: var(--cream);
      background: transparent;
      font: 500 clamp(1.35rem, 1.15vw, 1.5rem)/1 "Ma Shan Zheng", var(--serif);
      letter-spacing: 0;
    }

    .brand-copy { display: flex; flex-direction: column; gap: 5px; }
    .brand-name {
      color: var(--cream);
      font: 600 clamp(14px, .8vw, 17px)/1 var(--sans);
      letter-spacing: .18em;
    }
    .brand-subtitle {
      color: rgba(251, 244, 233, .75);
      font: 400 clamp(11px, .62vw, 13px)/1.2 var(--serif);
      letter-spacing: .055em;
    }

    .sound-toggle {
      position: fixed;
      z-index: 8;
      top: max(20px, 2.2vh, env(safe-area-inset-top));
      right: clamp(18px, 2.2vw, 38px);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid rgba(251, 244, 233, .38);
      border-radius: 999px;
      color: var(--cream);
      background: rgba(24, 25, 25, .22);
      font: 500 10px/1 var(--sans);
      letter-spacing: .08em;
      text-shadow: 0 1px 10px rgba(0, 0, 0, .3);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, opacity .2s ease;
    }

    .sound-toggle:hover { background: rgba(24, 25, 25, .42); border-color: rgba(251, 244, 233, .7); }
    .sound-toggle:focus-visible { outline: 2px solid rgba(255, 255, 255, .9); outline-offset: 3px; }
    .replay-button:focus-visible { outline: 2px solid #e3b35e; outline-offset: 4px; }
    .sound-toggle[aria-pressed="false"] {
      opacity: 1;
      color: #fff;
      border-color: #fff;
      background: rgba(255, 255, 255, .16);
      box-shadow: none;
      outline-color: #fff;
    }
    .sound-toggle { font-size: 12px; }

    .scroll-cue,
    .replay-button {
      position: fixed;
      z-index: 7;
      right: clamp(20px, 3.2vw, 54px);
      bottom: calc(26px + env(safe-area-inset-bottom));
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: rgba(251, 244, 233, .92);
      text-shadow: 0 1px 12px rgba(0, 0, 0, .4);
      pointer-events: none;
    }

    .cue-copy { display: inline-flex; align-items: baseline; gap: 9px; }
    .cue-en {
      font: 600 10px/1 var(--sans);
      letter-spacing: .16em;
    }
    .cue-cn { font: 500 12px/1 var(--sans); letter-spacing: .12em; }
    .cue-arrow { width: 20px; height: 22px; color: #e3b35e; animation: cue-bob 1.25s ease-in-out infinite; }
    @keyframes cue-bob {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(4px); }
    }

    .replay-button {
      display: none;
      gap: 10px;
      min-height: 36px;
      padding: 5px 0;
      border: 0;
      border-bottom: 1px solid rgba(251, 244, 233, .65);
      color: var(--cream);
      background: transparent;
      font: 500 12px/1 var(--sans);
      letter-spacing: .12em;
      cursor: pointer;
      pointer-events: auto;
      transition: opacity .2s ease, border-color .2s ease;
    }

    .replay-button:hover { border-color: #e3b35e; }
    .replay-button svg { width: 16px; height: 16px; color: #e3b35e; }
    body[data-mode="outro"] .scroll-cue { display: none; }
    body[data-mode="outro"] .replay-button { display: inline-flex; }

    .caption {
      position: fixed;
      z-index: 5;
      right: 0;
      bottom: calc(clamp(48px, 9.5vh, 112px) + env(safe-area-inset-bottom));
      left: 0;
      width: 100%;
      opacity: 0;
      transform: translate3d(0, 16px, 0);
      transition: opacity .48s ease, transform .58s cubic-bezier(.2, .7, .2, 1);
      pointer-events: none;
    }

    .caption.is-visible {
      opacity: 1;
      transform: translate3d(0, 0, 0);
    }

    .caption--left-mid {
      top: 50%;
      bottom: auto;
      transform: translate3d(0, calc(-50% + 16px), 0);
    }

    .caption--left-mid.is-visible { transform: translate3d(0, -50%, 0); }
    .caption--left-mid .caption-grid {
      width: min(980px, calc(58vw - 100px));
      margin-right: auto;
      margin-left: clamp(32px, 8vw, 150px);
    }

    .caption--left-mid h1 {
      max-width: none;
      font-size: clamp(2.2rem, 4.4vw, 5rem);
      line-height: 1.12;
    }

    body[data-mode="intro"] .caption {
      visibility: hidden;
      opacity: 0;
    }

    .caption-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: end;
      gap: 0;
      width: min(1240px, calc(100vw - clamp(44px, 11vw, 164px)));
      margin-inline: auto;
    }

    .caption-main { min-width: 0; }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 clamp(12px, 2vh, 23px);
      color: rgba(251, 244, 233, .85);
      font: 500 10px/1.2 var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow-number { color: var(--cream); }
    .eyebrow-label { color: rgba(251, 244, 233, .66); }
    .eyebrow-rule {
      width: clamp(26px, 4vw, 52px);
      height: 1px;
      background: var(--tomato);
    }

    .caption h1 {
      max-width: 16em;
      margin: 0;
      color: var(--cream);
      font-family: var(--serif);
      font-size: clamp(2.25rem, 5.1vw, 5.25rem);
      font-weight: 600;
      line-height: 1.16;
      letter-spacing: .012em;
      text-wrap: pretty;
      white-space: pre-line;
      text-shadow: 0 2px 24px rgba(0, 0, 0, .24);
    }

    .caption-second-line { white-space: pre-line; }
    .caption-note {
      font-size: .62em;
      font-weight: 500;
      line-height: 1.16;
    }

    .caption-note--memorial {
      position: relative;
      top: -.16em;
      display: inline-block;
      color: rgba(251, 244, 233, .75);
      font-family: var(--serif);
      font-size: .52em;
      font-weight: 600;
      letter-spacing: .025em;
      line-height: 1.1;
    }

    .caption-note--thanks {
      position: relative;
      top: -.15em;
      display: inline-block;
      color: rgba(251, 244, 233, .5);
      font-size: .5em;
      line-height: 1.1;
    }

    .progress-rail {
      position: fixed;
      z-index: 4;
      top: 18vh;
      right: clamp(18px, 3.1vw, 46px);
      bottom: 18vh;
      width: 2px;
      overflow: visible;
      background: rgba(251, 244, 233, .27);
      pointer-events: none;
    }

    .progress-fill {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--tomato);
      transform: scaleY(0);
      transform-origin: top center;
      will-change: transform;
    }

    .progress-tick {
      position: absolute;
      left: 50%;
      width: 7px;
      height: 7px;
      border: 1px solid rgba(251, 244, 233, .88);
      border-radius: 50%;
      background: #303a40;
      transform: translate(-50%, -50%);
    }

    .media-status {
      position: fixed;
      z-index: 6;
      right: 22px;
      bottom: max(17px, env(safe-area-inset-bottom));
      left: 22px;
      color: rgba(251, 244, 233, .72);
      font: 400 11px/1.6 var(--sans);
      text-align: center;
      text-shadow: 0 1px 12px rgba(0, 0, 0, .6);
      pointer-events: none;
    }
    .media-status[hidden] { display: none; }

    .noscript-note {
      position: fixed;
      z-index: 9;
      right: 20px;
      bottom: 20px;
      left: 20px;
      padding: 12px 16px;
      color: var(--ink);
      background: var(--paper);
      font: 14px/1.6 var(--sans);
      text-align: center;
    }

    @media (max-width: 760px) {
      .topline {
        top: max(19px, env(safe-area-inset-top));
        left: 22px;
        font-size: 9px;
      }

      .brand-mark { width: 44px; font-size: 1.3rem; }
      .brand-name { font-size: 14px; }
      .brand-subtitle { font-size: 10px; }

      .caption {
        bottom: calc(clamp(36px, 7.2vh, 66px) + env(safe-area-inset-bottom));
      }

      .caption-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        width: calc(100vw - 44px);
      }

      .eyebrow { margin-bottom: 11px; font-size: 9px; gap: 9px; }

      .sound-toggle {
        top: max(14px, env(safe-area-inset-top));
        right: 16px;
        min-height: 32px;
        padding: 6px 9px;
        font-size: 12px;
      }

      .scroll-cue, .replay-button {
        right: 20px;
        bottom: calc(17px + env(safe-area-inset-bottom));
        gap: 8px;
      }
      .cue-en { display: none; }
      .cue-cn { font-size: 12px; }
      .cue-arrow { width: 18px; height: 20px; }
      .replay-button { font-size: 11px; }

      .caption h1 {
        max-width: 15em;
        font-size: clamp(2rem, 8.2vw, 3.35rem);
        line-height: 1.23;
      }

      .caption--left-mid .caption-grid {
        width: calc(100vw - 44px);
        margin-inline: auto;
      }

      .caption--left-mid h1 {
        font-size: clamp(2rem, 8.2vw, 3.25rem);
        line-height: 1.2;
      }

      .progress-rail { display: none; }
    }

    @media (pointer: coarse) {
      html, body { touch-action: pan-x pinch-zoom; }
    }

    @media (max-width: 390px) {
      .caption-grid { width: calc(100vw - 38px); }
      .caption h1 { font-size: clamp(1.85rem, 8.1vw, 2.3rem); }
      .caption--left-mid .caption-grid { width: calc(100vw - 38px); }
      .caption--left-mid h1 { font-size: clamp(1.85rem, 8.1vw, 2.3rem); }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .topline { top: max(13px, env(safe-area-inset-top)); }
      .caption { bottom: calc(18px + env(safe-area-inset-bottom)); }
      .caption-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
        width: calc(100vw - 100px);
      }
      .eyebrow { margin-bottom: 7px; font-size: 8px; }
      .caption h1 { font-size: clamp(1.45rem, 4.3vh, 2.2rem); line-height: 1.12; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene, .caption { transition-duration: .2s; }
      .cue-arrow { animation: none; }
    }
  </style>
</head>
<body data-mode="intro" data-entry="closed">
  <div class="video-stage" aria-hidden="true">
    <video id="intro-video" class="scene" src="网站素材/intro-loop.mp4" autoplay loop playsinline preload="auto" tabindex="-1"></video>
    <video id="main-video" class="scene" src="网站素材/main.mp4" muted playsinline preload="auto" tabindex="-1"></video>
    <video id="outro-video" class="scene" src="网站素材/outro-loop.mp4" loop muted playsinline preload="auto" tabindex="-1"></video>
  </div>
  <div class="cinema-shade" aria-hidden="true"></div>

  <div id="entry-gate" class="entry-gate">
    <div class="entry-content">
      <button id="entry-button" class="entry-button" type="button" aria-label="点击进入小鼠麦兜日记">
        <img src="网站素材/butten.png" alt="点击进入小鼠麦兜日记">
      </button>
      <p class="entry-hint">记得打开声音哦</p>
    </div>
  </div>

  <div class="topline" aria-hidden="true">
    <span class="topline-brand">
      <span class="brand-mark">兜</span>
      <span class="brand-copy">
        <span class="brand-name">MAIDOU.</span>
        <span class="brand-subtitle">一段小小鼠生</span>
      </span>
    </span>
  </div>

  <button id="sound-toggle" class="sound-toggle" type="button" aria-label="关闭声音" aria-pressed="true">
    <span id="sound-label">声音已开启</span>
  </button>

  <div class="scroll-cue" aria-hidden="true">
    <span class="cue-copy"><span class="cue-en">SCROLL TO REMEMBER</span><span class="cue-cn">向下轻轻滑动</span></span>
    <svg class="cue-arrow" viewBox="0 0 20 22" fill="none"><path d="M10 1v17m0 0-7-7m7 7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <button id="replay-button" class="replay-button" type="button">
    <span>再看一遍</span>
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.8 8A7 7 0 1 0 17 11m-.2-7v4.5h-4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <main id="scroll-space" class="scroll-space" aria-hidden="true"></main>

  <section id="caption" class="caption" aria-hidden="true" aria-live="polite" aria-atomic="true">
    <div class="caption-grid">
      <div class="caption-main">
        <p class="eyebrow">
          <span class="eyebrow-number" id="chapter-number">01 / 07</span>
          <span class="eyebrow-rule"></span>
          <span class="eyebrow-label">麦兜的日常切片</span>
        </p>
        <h1 id="caption-text"></h1>
      </div>
    </div>
  </section>

  <div id="progress-rail" class="progress-rail" aria-hidden="true">
    <span id="progress-fill" class="progress-fill"></span>
  </div>

  <p id="media-status" class="media-status" role="status" hidden></p>
  <audio id="outro-music" src="网站素材/RIPmaidou.mp3" loop preload="auto"></audio>

  <noscript><div class="noscript-note">请启用 JavaScript，才能跟随滚动观看麦兜的故事。</div></noscript>

  <script>
    (() => {
      'use strict';

      const DEFAULT_DURATION = 38;
      const FINE_POINTER_SCROLL_SCREENS = 8;
      const SCROLL_IDLE_MS = 520;
      const BEATS = [
        { time: 1, copy: '你好，我是麦兜\n打工，本鼠是认真的', window: 1.2 },
        { time: 5, copy: '下班咯，奖励环节', window: 0.82 },
        { time: 9, copy: '好吧，这才是我\n一只普普通通的小鼠', window: 0.82 },
        { time: 14, copy: '等一下，好像...\n有零食！', window: 0.82 },
        { time: 19, copy: '蓝莓！一定又是人悄悄放的\n谢谢人～', smallSecondLine: true, thanksNote: true, window: 0.88 },
        { time: 29, copy: '本鼠才不胖呢\n有跑轮每天都会健身哦', window: 0.9 },
        { time: 38, copy: '晚安，鼠要做一个很长的梦...\n麦兜（2024.6.4-2026.6.6）', smallSecondLine: true, memorialNote: true, window: 1.1 }
      ];

      const root = document.documentElement;
      const body = document.body;
      const entryButton = document.getElementById('entry-button');
      const scroller = document.getElementById('scroll-space');
      const intro = document.getElementById('intro-video');
      const main = document.getElementById('main-video');
      const outro = document.getElementById('outro-video');
      const music = document.getElementById('outro-music');
      const caption = document.getElementById('caption');
      const captionText = document.getElementById('caption-text');
      const chapterNumber = document.getElementById('chapter-number');
      const progressFill = document.getElementById('progress-fill');
      const progressRail = document.getElementById('progress-rail');
      const mediaStatus = document.getElementById('media-status');
      const soundToggle = document.getElementById('sound-toggle');
      const soundLabel = document.getElementById('sound-label');
      const replayButton = document.getElementById('replay-button');

      let duration = DEFAULT_DURATION;
      let targetTime = 0;
      let activeCaption = -1;
      let currentMode = '';
      let entryOpened = false;
      let rafId = 0;
      let seekRafId = 0;
      let lastFrameTime = 0;
      let lastSeekTime = 0;
      let lastObservedScrollY = 0;
      let lastSettledBeatIndex = -1;
      let lastUserScrollDirection = 1;
      let idleTimer = 0;
      let captionTimer = 0;
      let snapFrame = 0;
      let snapInProgress = false;
      let ignoreIdleUntil = 0;
      let mainAudioUnlocked = false;
      let musicAudioUnlocked = false;
      let introAudioUnlocked = false;
      let soundEnabled = true;
      let unlockPending = false;
      let mainAudioActive = false;
      let mainSeekSettling = false;
      let mainSeekTimeout = 0;
      let musicFadeFrame = 0;
      let musicFadeCompletion = null;
      let touchStart = null;
      let touchDidMove = false;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const finite = (value) => Number.isFinite(value) && value > 0;
      const hasFinePointer = () => window.matchMedia && window.matchMedia('(pointer: fine)').matches;

      function setDuration(nextDuration) {
        if (!finite(nextDuration)) return;
        duration = nextDuration;
        BEATS[BEATS.length - 1].time = duration;
        root.style.setProperty('--duration', String(duration));
        updateScrollHeight();
        makeProgressTicks();
        updateFromScroll();
      }

      function updateScrollHeight() {
        const viewportHeight = Math.max(1, window.innerHeight || root.clientHeight || 1);
        const screens = hasFinePointer() ? Math.min(duration, FINE_POINTER_SCROLL_SCREENS) : duration;
        const height = Math.max(viewportHeight, screens * viewportHeight);
        root.style.setProperty('--scroll-height', height + 'px');
      }

      function maxScrollY() {
        return Math.max(0, root.scrollHeight - window.innerHeight);
      }

      function readScroll() {
        const max = maxScrollY();
        const progress = max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
        return { progress, time: progress * duration, max };
      }

      function safePlay(video) {
        if (!video || video.classList.contains('is-broken')) return Promise.resolve(false);
        try {
          const result = video.play();
          if (result && typeof result.then === 'function') {
            return result.then(() => true).catch(() => false);
          }
          return Promise.resolve(true);
        } catch (_) {
          return Promise.resolve(false);
        }
      }

      function safePause(video) {
        try { video.pause(); } catch (_) { /* media may be unavailable */ }
      }

      function playIntro() {
        if (intro.classList.contains('is-broken')) return;
        intro.muted = !soundEnabled;
        try {
          const result = intro.play();
          if (result && typeof result.then === 'function') {
            result.then(() => {
              if (!intro.muted) introAudioUnlocked = true;
            }).catch(() => {
              if (introAudioUnlocked || !soundEnabled) {
                if (!soundEnabled) safePlay(intro);
                return;
              }
              intro.muted = true;
              const fallback = intro.play();
              if (fallback && typeof fallback.catch === 'function') fallback.catch(() => {});
            });
          } else if (!intro.muted) {
            introAudioUnlocked = true;
          }
        } catch (_) {
          if (!introAudioUnlocked) intro.muted = true;
          safePlay(intro);
        }
      }

      function unlockIntroAudioFromGesture() {
        if (!soundEnabled || currentMode !== 'intro' || introAudioUnlocked || intro.classList.contains('is-broken')) return;
        intro.muted = false;
        if (!intro.paused) {
          introAudioUnlocked = true;
          return;
        }
        try {
          const result = intro.play();
          if (result && typeof result.then === 'function') {
            result.then(() => { introAudioUnlocked = true; }).catch(() => {});
          } else {
            introAudioUnlocked = true;
          }
        } catch (_) { /* browser may require another trusted gesture */ }
      }

      function setMode(mode) {
        if (mode === currentMode) return;
        currentMode = mode;
        body.dataset.mode = mode;

        if (mode === 'intro') {
          stopMainAudio();
          safePause(main);
          safePause(outro);
          fadeMusicTo(0, 420, () => safePause(music));
          playIntro();
        } else if (mode === 'main') {
          safePause(intro);
          safePause(outro);
          fadeMusicTo(0, 420, () => safePause(music));
          if (!mainAudioActive) safePause(main);
        } else {
          stopMainAudio();
          safePause(intro);
          safePause(main);
          safePlay(outro);
          startOutroMusic();
        }
      }

      function applyProgress(progress) {
        const p = clamp(progress, 0, 1);
        targetTime = p * duration;
        const mode = p >= 1 ? 'outro' : (p <= 0.00001 ? 'intro' : 'main');
        setMode(mode);
        progressFill.style.transform = 'scaleY(' + p + ')';
        updateCaption(targetTime);
      }

      function updateFromScroll() {
        const state = readScroll();
        applyProgress(state.progress);
        return state;
      }

      function makeProgressTicks() {
        if (!progressRail) return;
        progressRail.querySelectorAll('.progress-tick').forEach((tick) => tick.remove());
        BEATS.forEach((beat) => {
          const tick = document.createElement('i');
          tick.className = 'progress-tick';
          tick.style.top = (clamp(beat.time / duration, 0, 1) * 100) + '%';
          progressRail.appendChild(tick);
        });
      }

      function captionAt(time) {
        let found = -1;
        let nearest = Infinity;
        BEATS.forEach((beat, index) => {
          if (currentMode !== 'outro' && index === BEATS.length - 1) return;
          const distance = Math.abs(time - beat.time);
          if (distance <= beat.window && distance < nearest) {
            found = index;
            nearest = distance;
          }
        });
        return found;
      }

      function updateCaption(time) {
        if (currentMode === 'intro') {
          activeCaption = -1;
          caption.classList.remove('is-visible');
          caption.classList.remove('caption--left-mid');
          caption.setAttribute('aria-hidden', 'true');
          window.clearTimeout(captionTimer);
          return;
        }

        const next = currentMode === 'outro' ? BEATS.length - 1 : captionAt(time);
        if (next === activeCaption) return;
        activeCaption = next;
        caption.classList.remove('is-visible');
        caption.setAttribute('aria-hidden', 'true');
        window.clearTimeout(captionTimer);

        if (next < 0) {
          caption.classList.remove('caption--left-mid');
          return;
        }

        captionTimer = window.setTimeout(() => {
          const beat = BEATS[next];
          caption.classList.toggle('caption--left-mid', next === 2 || next === 3);
          const lines = beat.copy.split('\n');
          const copy = document.createDocumentFragment();
          copy.append(document.createTextNode(lines[0] || ''));
          if (lines.length > 1) {
            const secondLine = document.createElement('span');
            secondLine.className = beat.smallSecondLine ? 'caption-second-line caption-note' : 'caption-second-line';
            if (beat.memorialNote) secondLine.classList.add('caption-note--memorial');
            if (beat.thanksNote) secondLine.classList.add('caption-note--thanks');
            secondLine.textContent = lines.slice(1).join('\n');
            copy.append(document.createElement('br'), secondLine);
          }
          captionText.replaceChildren(copy);
          chapterNumber.textContent = String(next + 1).padStart(2, '0') + ' / 07';
          caption.removeAttribute('aria-hidden');
          window.requestAnimationFrame(() => caption.classList.add('is-visible'));
        }, 125);
      }

      function stopMainAudio() {
        if (!mainAudioActive && main.muted) return;
        mainAudioActive = false;
        try {
          main.pause();
          main.muted = true;
          main.volume = 1;
        } catch (_) { /* media may be unavailable */ }
      }

      function settleMainAtBeat(time) {
        const frameTime = clamp(time, 0, Math.max(0, duration - 0.04));
        targetTime = frameTime;
        let closestIndex = 0;
        let closestDistance = Infinity;
        BEATS.forEach((beat, index) => {
          const distance = Math.abs(clamp(beat.time, 0, duration) - time);
          if (distance < closestDistance) {
            closestDistance = distance;
            closestIndex = index;
          }
        });
        lastSettledBeatIndex = closestIndex;
        stopMainAudio();
        if (main.classList.contains('is-broken') || main.readyState < 1) return;

        safePause(main);
        main.muted = true;
        if (!main.seeking && Math.abs(main.currentTime - frameTime) < 0.003) return;

        mainSeekSettling = true;
        let settled = false;
        const finish = () => {
          if (settled) return;
          settled = true;
          window.clearTimeout(mainSeekTimeout);
          main.removeEventListener('seeked', finish);
          mainSeekSettling = false;
          safePause(main);
        };

        main.addEventListener('seeked', finish);
        try {
          main.currentTime = frameTime;
          mainSeekTimeout = window.setTimeout(finish, 1200);
        } catch (_) {
          finish();
        }
      }

      function startMainAudio() {
        if (!soundEnabled || !mainAudioUnlocked || currentMode !== 'main' || main.classList.contains('is-broken')) return;
        if (mainAudioActive && !main.paused && !main.muted) return;
        mainAudioActive = true;
        try {
          main.muted = false;
          main.volume = 0.72;
          const result = main.play();
          if (result && typeof result.catch === 'function') {
            result.catch(() => stopMainAudio());
          }
        } catch (_) {
          stopMainAudio();
        }
      }

      function fadeMusicTo(target, milliseconds, done) {
        window.cancelAnimationFrame(musicFadeFrame);
        musicFadeCompletion = done || null;
        if (!musicAudioUnlocked && target > 0) return;

        const from = Number.isFinite(music.volume) ? music.volume : 1;
        const start = performance.now();
        const durationMs = Math.max(1, milliseconds);
        const finish = () => {
          try { music.volume = target; } catch (_) { /* device volume may be fixed */ }
          const callback = musicFadeCompletion;
          musicFadeCompletion = null;
          if (callback) callback();
        };
        const step = (now) => {
          const progress = clamp((now - start) / durationMs, 0, 1);
          const eased = progress * progress * (3 - 2 * progress);
          try { music.volume = from + (target - from) * eased; } catch (_) { /* device volume may be fixed */ }
          if (progress < 1) musicFadeFrame = window.requestAnimationFrame(step);
          else finish();
        };
        musicFadeFrame = window.requestAnimationFrame(step);
      }

      function startOutroMusic() {
        if (!soundEnabled || currentMode !== 'outro') return;
        try {
          music.loop = true;
          music.muted = false;
          if (music.paused) {
            const result = music.play();
            if (result && typeof result.then === 'function') {
              result.then(() => {
                musicAudioUnlocked = true;
                if (soundEnabled && currentMode === 'outro') fadeMusicTo(0.74, 900);
              }).catch(() => {});
              return;
            }
          }
          musicAudioUnlocked = true;
          fadeMusicTo(0.74, 900);
        } catch (_) { /* keep the visual ending available without sound */ }
      }

      function unlockAudioFromGesture() {
        if (!soundEnabled) return;
        unlockIntroAudioFromGesture();
        if (currentMode === 'outro' && musicAudioUnlocked) startOutroMusic();
        if (unlockPending || (mainAudioUnlocked && musicAudioUnlocked)) return;
        unlockPending = true;
        window.cancelAnimationFrame(musicFadeFrame);
        musicFadeFrame = 0;
        musicFadeCompletion = null;
        music.volume = 0;

        const attempts = [];
        if (!mainAudioUnlocked && !main.classList.contains('is-broken')) {
          try {
            main.muted = false;
            main.volume = 0;
            const result = main.play();
            if (result && typeof result.then === 'function') {
              attempts.push(result.then(() => {
                main.pause();
                main.muted = true;
                main.volume = 1;
                mainAudioUnlocked = true;
              }).catch(() => {
                main.pause();
                main.muted = true;
                main.volume = 1;
              }));
            } else {
              main.pause();
              main.muted = true;
              main.volume = 1;
              mainAudioUnlocked = true;
            }
          } catch (_) {
            main.muted = true;
            main.volume = 1;
          }
        }

        if (!musicAudioUnlocked) {
          try {
            music.muted = false;
            music.volume = 0;
            const result = music.play();
            if (result && typeof result.then === 'function') {
              attempts.push(result.then(() => {
                music.pause();
                music.currentTime = 0;
                music.volume = 0;
                musicAudioUnlocked = true;
              }).catch(() => {
                music.pause();
                music.volume = 0;
              }));
            } else {
              music.pause();
              music.currentTime = 0;
              music.volume = 0;
              musicAudioUnlocked = true;
            }
          } catch (_) { /* retry on a later gesture */ }
        }

        Promise.allSettled(attempts).then(() => {
          unlockPending = false;
          if (currentMode === 'outro') startOutroMusic();
        });
      }

      function syncSoundToggle() {
        soundToggle.setAttribute('aria-pressed', String(soundEnabled));
        const label = soundEnabled ? '声音已开启' : '开启声音';
        soundToggle.setAttribute('aria-label', label);
        soundLabel.textContent = label;
      }

      function enterStory() {
        if (entryOpened) return;
        entryOpened = true;
        body.dataset.entry = 'open';
        root.classList.remove('entry-locked');
        window.scrollTo(0, 0);
        lastObservedScrollY = window.scrollY;
        lastSettledBeatIndex = -1;
        lastUserScrollDirection = 1;
        ignoreIdleUntil = performance.now() + 700;
        updateScrollHeight();
        updateFromScroll();
        if (soundEnabled) unlockAudioFromGesture();
      }

      function setSoundEnabled(enabled) {
        soundEnabled = Boolean(enabled);
        syncSoundToggle();
        if (!soundEnabled) {
          intro.muted = true;
          stopMainAudio();
          fadeMusicTo(0, 240, () => {
            music.muted = true;
            safePause(music);
          });
          return;
        }

        unlockAudioFromGesture();
        if (currentMode === 'intro') {
          intro.muted = false;
          playIntro();
        } else if (currentMode === 'outro') {
          music.muted = false;
          startOutroMusic();
        }
      }

      function replayFromBeginning() {
        window.clearTimeout(idleTimer);
        cancelSnap();
        lastSettledBeatIndex = -1;
        lastUserScrollDirection = 1;
        ignoreIdleUntil = performance.now() + 1000;
        try {
          if (intro.readyState >= 1) intro.currentTime = 0;
        } catch (_) { /* metadata may not be ready */ }
        window.scrollTo(0, 0);
        lastObservedScrollY = window.scrollY;
        updateFromScroll();
        if (soundEnabled) unlockAudioFromGesture();
      }

      function nearestBeat(time) {
        let best = BEATS[0];
        let distance = Infinity;
        BEATS.forEach((beat) => {
          const beatTime = clamp(beat.time, 0, duration);
          const nextDistance = Math.abs(time - beatTime);
          if (nextDistance < distance) {
            best = { time: beatTime, copy: beat.copy, window: beat.window };
            distance = nextDistance;
          }
        });
        return best;
      }

      function beatForStop(time) {
        const nearest = nearestBeat(time);
        if (lastSettledBeatIndex < 0) {
          if (lastUserScrollDirection > 0 && time > 0.06) return BEATS[0];
          return nearest;
        }

        const settled = BEATS[lastSettledBeatIndex];
        const settledTime = clamp(settled.time, 0, duration);
        const moved = time - settledTime;

        if (lastUserScrollDirection > 0 && moved > 0.06 && lastSettledBeatIndex < BEATS.length - 1) {
          const next = BEATS[lastSettledBeatIndex + 1];
          const nextTime = clamp(next.time, 0, duration);
          if (lastSettledBeatIndex === BEATS.length - 2 || time <= (settledTime + nextTime) / 2) {
            return { time: nextTime, copy: next.copy, window: next.window };
          }
        }

        if (lastUserScrollDirection < 0 && moved < -0.06 && lastSettledBeatIndex > 0) {
          const previous = BEATS[lastSettledBeatIndex - 1];
          const previousTime = clamp(previous.time, 0, duration);
          if (time > (previousTime + settledTime) / 2) {
            return { time: previousTime, copy: previous.copy, window: previous.window };
          }
        }

        return nearest;
      }

      function cancelSnap() {
        if (snapFrame) window.cancelAnimationFrame(snapFrame);
        snapFrame = 0;
        snapInProgress = false;
        stopMainAudio();
      }

      function snapToNearestBeat(preferredIndex) {
        if (snapInProgress || document.hidden) return;
        const state = readScroll();
        const hasPreferredBeat = Number.isInteger(preferredIndex);
        if (state.progress <= 0.00001 && !hasPreferredBeat) {
          lastSettledBeatIndex = -1;
          applyProgress(0);
          return;
        }
        if (!hasPreferredBeat && currentMode === 'outro' && lastUserScrollDirection > 0 && lastSettledBeatIndex >= 0) return;
        const beat = hasPreferredBeat
          ? { ...BEATS[clamp(preferredIndex, 0, BEATS.length - 1)] }
          : beatForStop(state.time);
        const endY = beat.time / duration * state.max;
        const startY = window.scrollY;
        const distance = endY - startY;
        if (Math.abs(distance) < 2) {
          window.scrollTo(0, endY);
          lastObservedScrollY = endY;
          applyProgress(beat.time / duration);
          ignoreIdleUntil = performance.now() + 160;
          settleMainAtBeat(beat.time);
          return;
        }

        snapInProgress = true;
        const forward = beat.time > state.time + 0.08;
        const audioStartTime = forward && mainAudioUnlocked && main.readyState >= 2 && Number.isFinite(main.currentTime)
          ? main.currentTime
          : state.time;
        const firstBeatCatch = !hasPreferredBeat && lastSettledBeatIndex < 0 && beat.time === BEATS[0].time;
        const snapDuration = firstBeatCatch
          ? clamp(Math.abs(beat.time - state.time) * 220, 220, 850)
          : clamp(Math.abs(beat.time - audioStartTime) * 1000, 240, 10000);
        const startedAt = performance.now();
        if (forward) startMainAudio();
        else stopMainAudio();

        const animate = (now) => {
          if (!snapInProgress) return;
          const progress = clamp((now - startedAt) / snapDuration, 0, 1);
          const eased = progress;
          const y = startY + distance * eased;
          window.scrollTo(0, y);
          const max = maxScrollY();
          applyProgress(max > 0 ? clamp(y / max, 0, 1) : 0);
          if (forward && soundEnabled && !mainAudioActive && currentMode === 'main') startMainAudio();
          if (progress < 1) {
            snapFrame = window.requestAnimationFrame(animate);
          } else {
            window.scrollTo(0, endY);
            applyProgress(clamp(endY / Math.max(1, maxScrollY()), 0, 1));
            snapInProgress = false;
            snapFrame = 0;
            lastObservedScrollY = endY;
            ignoreIdleUntil = performance.now() + 160;
            settleMainAtBeat(beat.time);
          }
        };
        snapFrame = window.requestAnimationFrame(animate);
      }

      function onUserIntent(event) {
        if (!entryOpened) return;
        const type = event && event.type;
        if (type !== 'wheel' && type !== 'touchmove' && event && event.target && event.target.closest && event.target.closest('#sound-toggle, #replay-button')) return;
        if (type === 'wheel' && event.deltaY) lastUserScrollDirection = event.deltaY > 0 ? 1 : -1;
        if (type === 'keydown') {
          if (['ArrowDown', 'PageDown', ' ', 'End'].includes(event.key)) lastUserScrollDirection = 1;
          if (['ArrowUp', 'PageUp', 'Home'].includes(event.key)) lastUserScrollDirection = -1;
        }
        if (snapInProgress) cancelSnap();
        ignoreIdleUntil = 0;
        if (type === 'touchstart' || lastUserScrollDirection < 0) {
          stopMainAudio();
        }
        unlockAudioFromGesture();
      }

      function onTouchStart(event) {
        if (!entryOpened) return;
        if (event.target && event.target.closest && event.target.closest('#sound-toggle, #replay-button')) {
          touchStart = null;
          touchDidMove = false;
          return;
        }
        if (!event.touches || event.touches.length !== 1) {
          touchStart = null;
          touchDidMove = false;
          return;
        }
        const touch = event.touches[0];
        touchStart = { x: touch.clientX, y: touch.clientY, time: performance.now() };
        touchDidMove = false;
        onUserIntent(event);
      }

      function onTouchMove(event) {
        if (!touchStart || !event.touches || event.touches.length !== 1) return;
        const touch = event.touches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        if (Math.abs(dy) > 8 && Math.abs(dy) > Math.abs(dx)) {
          touchDidMove = true;
          if (event.cancelable) event.preventDefault();
        }
      }

      function onTouchEnd(event) {
        if (!touchStart) return;
        const start = touchStart;
        touchStart = null;
        const touch = event.changedTouches && event.changedTouches[0];
        if (!touch || !touchDidMove) return;
        touchDidMove = false;

        const delta = start.y - touch.clientY;
        const horizontalDelta = touch.clientX - start.x;
        const elapsed = performance.now() - start.time;
        const enoughTravel = Math.abs(delta) >= 24 || (elapsed < 240 && Math.abs(delta) >= 12);
        if (!enoughTravel || Math.abs(delta) <= Math.abs(horizontalDelta)) return;

        const direction = delta > 0 ? 1 : -1;
        lastUserScrollDirection = direction;
        ignoreIdleUntil = 0;
        window.clearTimeout(idleTimer);
        if (snapInProgress) cancelSnap();

        const currentIndex = lastSettledBeatIndex;
        if (direction < 0 && currentIndex <= 0) {
          lastSettledBeatIndex = -1;
          ignoreIdleUntil = performance.now() + 1000;
          window.scrollTo(0, 0);
          lastObservedScrollY = window.scrollY;
          updateFromScroll();
          return;
        }

        const nextIndex = direction > 0
          ? Math.min(currentIndex + 1, BEATS.length - 1)
          : Math.max(currentIndex - 1, 0);
        snapToNearestBeat(nextIndex);
      }

      function onScroll() {
        if (!entryOpened) {
          window.scrollTo(0, 0);
          return;
        }
        const y = window.scrollY;
        const movedBy = y - lastObservedScrollY;
        if (!snapInProgress && Math.abs(movedBy) > 0.5) {
          lastUserScrollDirection = movedBy > 0 ? 1 : -1;
          ignoreIdleUntil = 0;
        }
        lastObservedScrollY = y;
        const state = updateFromScroll();
        if (snapInProgress) return;
        if (lastUserScrollDirection < 0) {
          stopMainAudio();
        }
        if (performance.now() < ignoreIdleUntil) return;
        window.clearTimeout(idleTimer);
        idleTimer = window.setTimeout(snapToNearestBeat, SCROLL_IDLE_MS);
        return state;
      }

      function animationFrame(now) {
        if (!lastFrameTime) lastFrameTime = now;
        const dt = Math.min(90, Math.max(1, now - lastFrameTime));
        lastFrameTime = now;

        // During a forward snap the video plays naturally at 1x. Rewriting currentTime
        // on every animation frame would repeatedly interrupt decoding and stutter audio.
        if (currentMode === 'main' && main.readyState >= 1 && !mainSeekSettling && !main.classList.contains('is-broken') && !(mainAudioActive && snapInProgress)) {
          const actual = Number.isFinite(main.currentTime) ? main.currentTime : 0;
          const error = targetTime - actual;
          const smoothing = 1 - Math.exp(-dt / 82);
          let next = actual + error * smoothing;
          if (Math.abs(error) < 0.012) next = targetTime;
          const interval = window.matchMedia('(pointer: coarse)').matches ? 64 : 34;
          if (Math.abs(error) > 0.012 && now - lastSeekTime >= interval) {
            try {
              main.currentTime = clamp(next, 0, Math.max(0, duration - 0.04));
              lastSeekTime = now;
            } catch (_) { /* metadata or media may not be ready yet */ }
          }
        }

        rafId = window.requestAnimationFrame(animationFrame);
      }

      function setMediaFailure(video, label) {
        video.classList.add('is-broken');
        mediaStatus.textContent = label + '暂时无法载入，仍可继续阅读章节。';
        mediaStatus.hidden = false;
        if (video === main) setDuration(DEFAULT_DURATION);
      }

      [intro, main, outro].forEach((video) => {
        video.addEventListener('error', () => {
          const label = video === intro ? '片头动画' : (video === main ? '主影片' : '片尾动画');
          setMediaFailure(video, label);
        });
      });

      entryButton.addEventListener('click', enterStory);
      soundToggle.addEventListener('click', () => setSoundEnabled(!soundEnabled));
      replayButton.addEventListener('click', replayFromBeginning);
      syncSoundToggle();

      main.addEventListener('loadedmetadata', () => setDuration(main.duration));
      main.addEventListener('durationchange', () => setDuration(main.duration));
      main.addEventListener('ended', () => {
        window.clearTimeout(idleTimer);
        if (snapInProgress) cancelSnap();
        lastSettledBeatIndex = BEATS.length - 1;
        lastUserScrollDirection = 1;
        const endY = maxScrollY();
        window.scrollTo(0, endY);
        lastObservedScrollY = endY;
        ignoreIdleUntil = performance.now() + 900;
        applyProgress(1);
      });
      window.addEventListener('resize', () => {
        updateScrollHeight();
        updateFromScroll();
      }, { passive: true });
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('wheel', onUserIntent, { passive: true });
      window.addEventListener('touchstart', onTouchStart, { passive: true });
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', onTouchEnd, { passive: true });
      window.addEventListener('touchcancel', () => { touchStart = null; touchDidMove = false; }, { passive: true });
      window.addEventListener('pointerdown', onUserIntent, { passive: true });
      window.addEventListener('keydown', (event) => {
        const scrollKeys = ['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', ' ', 'Home', 'End'];
        if (scrollKeys.includes(event.key)) onUserIntent(event);
      });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          stopMainAudio();
          safePause(intro);
          safePause(outro);
          safePause(music);
        } else {
          updateFromScroll();
        }
      });

      updateScrollHeight();
      makeProgressTicks();
      window.scrollTo(0, 0);
      lastObservedScrollY = 0;
      updateFromScroll();
      rafId = window.requestAnimationFrame(animationFrame);
    })();
  </script>
</body>
</html>
